# docker-compose.yml
# 一键启动：PostgreSQL(pgvector) + 后端(FastAPI) + 前端(Nginx)
# 使用命令：docker compose up -d --build
#
# 为什么知识库必须落到数据库：
# 之前 documents / chunks 都放在进程内存里，容器一重建（--build / 重启 / 改代码）
# 索引就没了，而 uploads/ 里的源文件还在 —— 表现和"权限过滤掉了"一模一样：
# 库里看着有文档，检索却 0 条，且没有任何日志能看出来。
# 现在切片与文档都在 PostgreSQL 里，向量检索由 pgvector 负责，重启不丢。

services:
  # ── 应用数据库（PostgreSQL 17 + pgvector）──────────────────────
  # 存两样东西：知识库（documents/chunks + 向量）和会话记忆
  # （chat_sessions/chat_messages/user_profiles）—— 都跨重启保留。─
  db:
    image: pgvector/pgvector:pg17
    container_name: workmind-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-workmind}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-workmind}
      POSTGRES_DB: ${PG_DATABASE:-workmind}
    ports:
      - "${PG_PORT:-5433}:5432"          # 宿主机用 5433，避免与本机已有的 PG 冲突
    volumes:
      - workmind-pgdata:/var/lib/postgresql/data   # 数据卷：容器重建数据仍在
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-workmind} -d ${PG_DATABASE:-workmind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── 答案缓存（Redis）───────────────────────────────────────────
  # 为什么需要它：进程内缓存"多实例不共享、重启即失"——
  # 起两个 worker 命中率直接减半，改一行代码重建容器后缓存全空、冷启动全打真模型。
  # Redis 只做 L2（跨实例共享 + 重启不丢），L1 仍在进程内；
  # 连不上时自动降级为纯 L1，不会因为缓存挂了让业务不可用。
  redis:
    image: redis:7-alpine
    container_name: workmind-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"        # 宿主机用 6380，避开本机已有的 6379
    command: >
      redis-server --save "" --appendonly no
      --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── 后端服务（Python / FastAPI）─────────────────────────────
  server:
    build:
      context: ./server-py
      dockerfile: Dockerfile
    container_name: workmind-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ALLOWED_ORIGINS=http://localhost:5173,https://yourdomain.com
      # 知识库数据库（服务名 db 即容器网络内的主机名）
      - DATABASE_URL=postgresql://${PG_USER:-workmind}:${PG_PASSWORD:-workmind}@db:5432/${PG_DATABASE:-workmind}
      - PGVECTOR_DIM=2048
      # 相似度阈值必须按 embedding 模型标定：智谱 embedding-3 上"语义相关但换了说法"
      # 的查询只有 0.42~0.45，写 0.5 会导致整片召不回
      - RAG_SIMILARITY_THRESHOLD=${RAG_SIMILARITY_THRESHOLD:-0.35}
      - RAG_TOP_K=${RAG_TOP_K:-6}
      # 检索不到内容时：grounded=明确说没找到（不拿模型自身知识兜底）/ fallback=照常回答
      # 自动模式下"库里没有"怎么办：fallback=先说明未命中、再用通用知识回答（默认）；
      # grounded=只回"没找到"（想在"自动"下也严格就改成 grounded）
      # 注意：「强制」不看这个开关，永远是只依据知识库作答
      - RAG_ANSWER_POLICY=${RAG_ANSWER_POLICY:-fallback}
      # 会话记忆：超过 N 轮异步做摘要，每次带「摘要 + 最近 K 轮」
      - MEMORY_SUMMARY_AFTER_ROUNDS=${MEMORY_SUMMARY_AFTER_ROUNDS:-10}
      - MEMORY_KEEP_ROUNDS=${MEMORY_KEEP_ROUNDS:-10}
      # 意图识别策略：recall_first（默认，默认就查库）/ strict（旧的严格模式）
      - RAG_INTENT_MODE=${RAG_INTENT_MODE:-recall_first}
      # 重排：llm=用 DEEPSEEK_API_KEY 打分（默认）/ bge=专用 rerank 接口 / none=关闭
      - RERANK_PROVIDER=${RERANK_PROVIDER:-llm}
      - RERANK_MODEL=${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      - RERANK_BASE_URL=${RERANK_BASE_URL:-https://api.siliconflow.cn/v1}
      - RERANK_API_KEY=${RERANK_API_KEY:-}
      - RERANK_POOL_MULT=${RERANK_POOL_MULT:-3}
      - RERANK_MAX_CANDIDATES=${RERANK_MAX_CANDIDATES:-12}
      - RERANK_MAX_CHARS=${RERANK_MAX_CHARS:-600}
      # 重排分数下限：低于它的候选直接丢弃，防止"主题沾边"的假命中把 Agent 锁死在知识分支
      - RAG_RERANK_MIN_SCORE=${RAG_RERANK_MIN_SCORE:-}
      # 联网搜索：不配 key 就是 demo 模式（只返回演示数据，并如实告知模型未接入真实搜索）
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - BOCHA_API_KEY=${BOCHA_API_KEY:-}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-auto}
      - SEARCH_MAX_RESULTS=${SEARCH_MAX_RESULTS:-5}
      # 智谱 Web Search：复用上面那个 ZHIPU_API_KEY（没额外配 key 也能真实联网）
      - ZHIPU_SEARCH_ENGINE=${ZHIPU_SEARCH_ENGINE:-search_std}
      # 工具循环最大步数（实测标定：默认 14；用尽会强制收尾，不会中途停在过程说明上）
      - AGENT_MAX_STEPS=${AGENT_MAX_STEPS:-14}
      # 日期工具按这个时区算"今天"（容器默认 UTC，会比北京时间差一天）
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Shanghai}
      # ── 韧性参数（超时 / 指数退避重试 / 熔断 / 降级）──────────────
      # 单次调用超时；底层客户端超时略短于它，好让重试逻辑能接手
      - LLM_TIMEOUT=${LLM_TIMEOUT:-30}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - LLM_RETRY_BASE_DELAY=${LLM_RETRY_BASE_DELAY:-0.5}
      - LLM_RETRY_MAX_DELAY=${LLM_RETRY_MAX_DELAY:-8}
      - TOOL_TIMEOUT=${TOOL_TIMEOUT:-20}
      - TOOL_MAX_RETRIES=${TOOL_MAX_RETRIES:-1}
      - BREAKER_FAIL_THRESHOLD=${BREAKER_FAIL_THRESHOLD:-5}
      - BREAKER_RECOVERY_SECONDS=${BREAKER_RECOVERY_SECONDS:-30}
      # 主模型不可用时的降级模型（复用知识库那个 ZHIPU_API_KEY）
      - MODEL_FALLBACK=${MODEL_FALLBACK:-auto}
      - FALLBACK_MODEL=${FALLBACK_MODEL:-glm-4-flash}
      - FALLBACK_BASE_URL=${FALLBACK_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      # ── 缓存（L1 进程内 + L2 Redis）──────────────────────────────
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./server-py/uploads:/app/uploads   # 上传文件持久化
    depends_on:
      db:
        condition: service_healthy         # 等数据库就绪再起后端，避免首次启动建表失败
      redis:
        condition: service_started         # 缓存没起也能跑（自动降级），所以只等启动

  # ── 前端服务（Vue3 / Vite 构建 + Nginx 托管）───────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workmind-frontend
    restart: unless-stopped
    ports:
      - "5173:80"                          # 访问 http://localhost:5173
    depends_on:
      - server                             # nginx 里把 /api 反代到 server:3000

volumes:
  workmind-pgdata:
