# frontend/nginx.conf
# 托管 Vue SPA，并把 /api、/health 反向代理到后端容器（service 名 server）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── 后端 API（含 SSE 流式，必须关闭缓冲）──────────────────
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;        # SSE 逐 token 推送的关键
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 健康检查 ──────────────────────────────────────────────
    location = /health { proxy_pass http://server:3000/health/; }
    location /health/ {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
    }

    # ── 带内容 hash 的静态资源：可以长期强缓存 ────────────────
    # 文件名里带 hash，内容一变文件名就变，所以缓存 7 天是安全的。
    # 注意：文件名里没有 hash 的静态文件（如 favicon 之外的裸文件）也会命中这里，
    # 新增此类文件时请给它起带 hash 的名字，或单独开 location。
    location ~* \.(js|css|png|jpe?g|gif|svg|ico|woff2?)$ {
        try_files $uri =404;        # 缺失的 chunk 必须真 404（前端据此触发自动刷新）
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ── index.html：绝对不能缓存 ──────────────────────────────
    # 它是唯一入口，指向带 hash 的 index-xxxx.js。如果它被浏览器缓存，
    # 前端重新构建后老页面还会去请求已经不存在的旧 chunk（404），
    # 表现就是「点菜单没反应」。no-cache = 每次都回源校验（304 很便宜）。
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # ── SPA 路由回退 ──────────────────────────────────────────
    # 内部重定向到 /index.html，因此上面那条 no-cache 同样生效
    location / {
        try_files $uri $uri/ /index.html;
    }
}
