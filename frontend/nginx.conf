# frontend/nginx.conf
# 托管 Vue SPA，并把 /api、/health 反向代理到后端容器（service 名 server）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── 后端 API（含 SSE 流式，必须关闭缓冲）──────────────────
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;        # SSE 逐 token 推送的关键
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 健康检查 ──────────────────────────────────────────────
    location = /health { proxy_pass http://server:3000/health/; }
    location /health/ {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
    }

    # ── 静态资源缓存 ──────────────────────────────────────────
    location ~* \.(js|css|png|jpe?g|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── SPA 路由回退 ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
